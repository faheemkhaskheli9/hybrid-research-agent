[project]
name = "hybrid-research-agent"
version = "0.1.0"
description = "Knowledge Base + Internet Research Agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "pydantic>=2.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
